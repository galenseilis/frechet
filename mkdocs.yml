site_name: Fréchet
site_description: Dependency-free Fréchet bounds on intersections, unions, and conditional probabilities.
site_author: Galen Seilis
site_url: https://galenseilis.github.io/frechet/
repo_name: galenseilis/frechet
repo_url: https://github.com/galenseilis/frechet
edit_uri: blob/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  homepage: https://galenseilis.github.io/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/galenseilis/frechet

nav:
  - Home: index.md
  - Tutorials:
      - Getting started: tutorials/getting-started.md
  - How-to guides:
      - Intersections and unions: how-to/intersections-and-unions.md
      - Conditional probabilities: how-to/conditional-probabilities.md
      - Independence and disjointness: how-to/independence-and-disjointness.md
  - Reference:
      - API reference: reference/api.md
  - Explanation:
      - Mathematical background: explanation/mathematical-background.md
      - Worked examples: explanation/worked-examples.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
